<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" role="img" aria-labelledby="title desc">
  <title id="title">Sunrise Alarm home screen</title>
  <desc id="desc">A calm alarm setup with a 7:30 wake-up and a button to start Sleep Mode.</desc>
  <defs>
    <linearGradient id="heroShade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#050816" stop-opacity=".38"/><stop offset=".54" stop-color="#050816" stop-opacity=".12"/><stop offset="1" stop-color="#050816" stop-opacity=".56"/></linearGradient>
    <linearGradient id="sleepCta" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F28C5A"/><stop offset="1" stop-color="#FFB56B"/></linearGradient>
    <clipPath id="heroClip"><rect x="16" y="128" width="328" height="260" rx="28"/></clipPath>
  </defs>
  <rect width="360" height="800" fill="#08090D"/>
  <text x="25" y="23" fill="#F6F4EF" font-family="Arial,sans-serif" font-size="12" font-weight="600">9:41</text>
  <g fill="none" stroke="#F6F4EF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M278 18h2m3-3v6m4-8v10m5-6v6"/><path d="M298 15c5 0 8 3 8 7h-16c0-4 3-7 8-7Z"/><rect x="316" y="14" width="19" height="10" rx="2"/><path d="M337 17v4"/></g><rect x="318" y="16" width="13" height="6" rx="1" fill="#F6F4EF"/>
  <text x="20" y="71" fill="#FFB56B" font-family="Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="2">SUNRISE ALARM</text>
  <text x="20" y="104" fill="#F6F4EF" font-family="Arial,sans-serif" font-size="25" font-weight="700">Good evening, <tspan fill="#FFB56B">gently.</tspan></text>
  <circle cx="324" cy="81" r="18" fill="#1A1E28" stroke="#292E3A"/>
  <circle cx="324" cy="81" r="8" fill="none" stroke="#F6F4EF" stroke-width="1.5"/><path d="M324 77v5l3 2" fill="none" stroke="#F6F4EF" stroke-width="1.4" stroke-linecap="round"/>
  <g clip-path="url(#heroClip)">
    <image href="sunrise-alarm-art.jpg" x="16" y="128" width="328" height="260" preserveAspectRatio="xMidYMid slice"/>
    <rect x="16" y="128" width="328" height="260" fill="url(#heroShade)"/>
  </g>
  <text x="39" y="164" fill="#FFFFFF" fill-opacity=".78" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">NEXT WAKE-UP</text>
  <rect x="286" y="150" width="37" height="21" rx="11" fill="#F28C5A"/><circle cx="312" cy="160.5" r="8" fill="#FFF8EF"/>
  <text x="38" y="253" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="61" font-weight="300" letter-spacing="-2">07:30</text>
  <text x="40" y="278" fill="#FFFFFF" fill-opacity=".83" font-family="Arial,sans-serif" font-size="14">Sunrise begins at 07:00</text>
  <rect x="38" y="303" width="110" height="38" rx="15" fill="#FFF0BB" fill-opacity=".94"/>
  <path d="m53 321 4 4 8-9" fill="none" stroke="#21170D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="326" fill="#21170D" font-family="Arial,sans-serif" font-size="12" font-weight="800">Save time</text>
  <rect x="16" y="405" width="328" height="78" rx="23" fill="url(#sleepCta)"/>
  <circle cx="49" cy="444" r="18" fill="#21170D" fill-opacity=".1"/><path d="M49 432a12 12 0 1 0 12 16 10 10 0 0 1-12-16Z" fill="#21170D"/>
  <text x="78" y="440" fill="#21170D" font-family="Arial,sans-serif" font-size="16" font-weight="800">I’m going to sleep</text>
  <text x="78" y="459" fill="#21170D" fill-opacity=".72" font-family="Arial,sans-serif" font-size="10">Start a quiet, screen-safe night</text>
  <path d="m315 440 9 0m-5-5 5 5-5 5" fill="none" stroke="#21170D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="16" y="500" width="328" height="116" rx="22" fill="#12151D" stroke="#292E3A"/>
  <text x="34" y="527" fill="#A6A7B0" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">REPEAT</text>
  <text x="34" y="549" fill="#F6F4EF" font-family="Arial,sans-serif" font-size="14" font-weight="700">Choose your days</text>
  <g font-family="Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="51" cy="585" r="16" fill="#1A1E28" stroke="#292E3A"/><text x="51" y="589" fill="#A6A7B0">S</text>
    <circle cx="94" cy="585" r="16" fill="#FFB56B"/><text x="94" y="589" fill="#2B1B0D">M</text>
    <circle cx="137" cy="585" r="16" fill="#FFB56B"/><text x="137" y="589" fill="#2B1B0D">T</text>
    <circle cx="180" cy="585" r="16" fill="#FFB56B"/><text x="180" y="589" fill="#2B1B0D">W</text>
    <circle cx="223" cy="585" r="16" fill="#FFB56B"/><text x="223" y="589" fill="#2B1B0D">T</text>
    <circle cx="266" cy="585" r="16" fill="#FFB56B"/><text x="266" y="589" fill="#2B1B0D">F</text>
    <circle cx="309" cy="585" r="16" fill="#1A1E28" stroke="#292E3A"/><text x="309" y="589" fill="#A6A7B0">S</text>
  </g>
  <rect x="16" y="632" width="328" height="66" rx="21" fill="#12151D" stroke="#292E3A"/>
  <circle cx="43" cy="665" r="12" fill="none" stroke="#FFB56B" stroke-width="1.5"/><path d="M43 658v7l5 3" fill="none" stroke="#FFB56B" stroke-width="1.5" stroke-linecap="round"/>
  <text x="66" y="660" fill="#A6A7B0" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing=".9">SUNRISE DURATION</text>
  <text x="66" y="680" fill="#F6F4EF" font-family="Arial,sans-serif" font-size="13" font-weight="700">30 minutes of gentle light</text>
  <rect x="0" y="713" width="360" height="87" fill="#12151D" stroke="#292E3A"/>
  <g font-family="Arial,sans-serif" font-size="9" text-anchor="middle">
    <circle cx="48" cy="740" r="8" fill="none" stroke="#FFB56B" stroke-width="1.6"/><path d="M48 727v-3m0 32v-3m-13-9h-3m32 0h-3m-22-9-2-2m22 22-2-2m0-18 2-2m-22 22 2-2" stroke="#FFB56B" stroke-width="1.3"/>
    <text x="48" y="768" fill="#FFB56B" font-weight="700">Alarm</text>
    <circle cx="136" cy="740" r="8" fill="none" stroke="#A6A7B0" stroke-width="1.5"/><path d="M136 735v6l4 2" fill="none" stroke="#A6A7B0" stroke-width="1.4" stroke-linecap="round"/><text x="136" y="768" fill="#A6A7B0">Alarms</text>
    <path d="M224 731a9 9 0 1 0 10 13 8 8 0 0 1-10-13Z" fill="none" stroke="#A6A7B0" stroke-width="1.5"/><text x="224" y="768" fill="#A6A7B0">Sleep</text>
    <circle cx="312" cy="740" r="8" fill="none" stroke="#A6A7B0" stroke-width="1.5"/><circle cx="312" cy="740" r="2.5" fill="none" stroke="#A6A7B0" stroke-width="1.4"/><path d="M312 728v3m0 18v3m-12-12h3m18 0h3" stroke="#A6A7B0" stroke-width="1.4"/><text x="312" y="768" fill="#A6A7B0">Settings</text>
  </g>
  <rect x="145" y="786" width="70" height="4" rx="2" fill="#F6F4EF"/>
</svg>
